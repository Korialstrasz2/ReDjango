name: Fix Master AI management types

on:
  push:
    branches:
      - agent/master-ai-proposal-system
    paths:
      - ".github/workflows/fix-master-ai-management-types.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-proposal-system
      - name: Replace intersected collection types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/features/management/AIManagementPage.tsx")
          content = path.read_text(encoding="utf-8")
          old = 'type ManagementData = AIManagementData & {\n  agents: ManagedAgent[];\n  tools: ManagedTool[];'
          new = 'type ManagementData = Omit<AIManagementData, "agents" | "tools"> & {\n  agents: ManagedAgent[];\n  tools: ManagedTool[];'
          if new not in content:
              if old not in content:
                  raise SystemExit("ManagementData type anchor not found.")
              content = content.replace(old, new, 1)
              path.write_text(content, encoding="utf-8")
          PY
          rm .github/workflows/fix-master-ai-management-types.yml
      - name: Commit type correction and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/management/AIManagementPage.tsx .github/workflows/fix-master-ai-management-types.yml
          git commit -m "Fix Master AI management types"
          git push origin HEAD:agent/master-ai-proposal-system
