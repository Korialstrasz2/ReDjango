name: Fix Master AI OpenAPI syntax

on:
  push:
    branches:
      - agent/master-ai-proposal-system
    paths:
      - ".github/workflows/fix-master-ai-openapi.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-proposal-system
      - name: Generate and validate the proposal contract
        run: |
          cat > /tmp/generate_master_ai_openapi.py <<'PY'
          from pathlib import Path
          import json

          def response(ref):
              return {"$ref": f"#/components/responses/{ref}"}

          def action_parameter():
              return {"$ref": "#/components/parameters/ActionHeader"}

          def change_set_parameter():
              return {"$ref": "#/components/parameters/ChangeSetId"}

          def operation_parameter():
              return {"$ref": "#/components/parameters/OperationId"}

          def request_body(schema):
              return {
                  "required": True,
                  "content": {"application/json": {"schema": {"$ref": f"#/components/schemas/{schema}"}}},
              }

          def mutation(summary, request_schema=None, success="ChangeSetDetail", status="200", conflicts=True):
              operation = {
                  "tags": ["Master AI proposals"],
                  "summary": summary,
                  "parameters": [action_parameter()],
                  "responses": {
                      status: response(success),
                      "400": response("Error"),
                      "403": response("Forbidden"),
                  },
              }
              if request_schema:
                  operation["requestBody"] = request_body(request_schema)
              if conflicts:
                  operation["responses"]["409"] = response("Conflict")
              return operation

          problem = {
              "type": "object",
              "required": ["code", "message"],
              "properties": {
                  "code": {"type": "string"},
                  "message": {"type": "string"},
                  "field": {"type": ["string", "null"]},
                  "operationId": {"type": ["integer", "null"]},
              },
          }
          field_schema = {
              "type": "object",
              "required": ["name", "label", "kind", "group", "required", "nullable", "readOnly", "choices", "ui"],
              "properties": {
                  "name": {"type": "string"},
                  "label": {"type": "string"},
                  "kind": {"type": "string"},
                  "group": {"type": "string"},
                  "required": {"type": "boolean"},
                  "nullable": {"type": "boolean"},
                  "readOnly": {"type": "boolean"},
                  "help": {"type": "string"},
                  "choices": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "required": ["value", "label"],
                          "properties": {"value": {}, "label": {"type": "string"}},
                      },
                  },
                  "ui": {"type": "object", "additionalProperties": True},
              },
          }
          operation_schema = {
              "type": "object",
              "required": ["id", "position", "entityType", "intent", "action", "selected", "status", "effectiveValues", "fields", "diff", "errors", "warnings"],
              "properties": {
                  "id": {"type": "integer"},
                  "position": {"type": "integer"},
                  "entityType": {"$ref": "#/components/schemas/EntityType"},
                  "entityLabel": {"type": "string"},
                  "intent": {"type": "string", "enum": ["create", "clone", "update", "archive"]},
                  "action": {"type": "string", "enum": ["create", "update", "archive"]},
                  "targetId": {"type": ["integer", "null"]},
                  "sourceId": {"type": ["integer", "null"]},
                  "displayLabel": {"type": "string"},
                  "selected": {"type": "boolean"},
                  "status": {"type": "string", "enum": ["proposed", "valid", "invalid", "applied", "skipped"]},
                  "original": {"type": "object", "additionalProperties": True},
                  "proposedValues": {"type": "object", "additionalProperties": True},
                  "editedValues": {"type": "object", "additionalProperties": True},
                  "effectiveValues": {"type": "object", "additionalProperties": True},
                  "fields": {"type": "array", "items": {"$ref": "#/components/schemas/FieldSchema"}},
                  "diff": {"type": "array", "items": {"type": "object", "additionalProperties": True}},
                  "errors": {"type": "array", "items": {"$ref": "#/components/schemas/Problem"}},
                  "warnings": {"type": "array", "items": {"$ref": "#/components/schemas/Problem"}},
                  "result": {"type": "object", "additionalProperties": True},
                  "baseUpdatedAt": {"type": ["string", "null"], "format": "date-time"},
                  "baseDigest": {"type": "string"},
              },
          }
          safe_context = {
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "entityType": {"$ref": "#/components/schemas/EntityType"},
                  "targetId": {"type": "integer", "minimum": 1},
                  "sourceId": {"type": "integer", "minimum": 1},
                  "sourceSurface": {
                      "type": "string",
                      "enum": ["item-management", "skill-management", "theme-management", "management-hub", "master-ai"],
                  },
              },
          }
          change_set = {
              "type": "object",
              "required": ["id", "title", "status", "revision", "requestText", "context", "canEdit", "canValidate", "canApply", "canDiscard", "validation"],
              "properties": {
                  "id": {"type": "string", "format": "uuid"},
                  "title": {"type": "string"},
                  "status": {"type": "string", "enum": ["draft", "ready", "applied", "discarded", "expired"]},
                  "revision": {"type": "integer"},
                  "requestText": {"type": "string"},
                  "context": {"$ref": "#/components/schemas/SafeContext"},
                  "conversationId": {"type": ["integer", "null"]},
                  "agentId": {"type": ["integer", "null"]},
                  "canEdit": {"type": "boolean"},
                  "canValidate": {"type": "boolean"},
                  "canApply": {"type": "boolean"},
                  "canDiscard": {"type": "boolean"},
                  "validation": {
                      "type": "object",
                      "properties": {
                          "token": {"type": "string"},
                          "validatedAt": {"type": ["string", "null"], "format": "date-time"},
                          "summary": {"type": "object", "additionalProperties": True},
                          "errors": {"type": "array", "items": {"$ref": "#/components/schemas/Problem"}},
                          "warnings": {"type": "array", "items": {"$ref": "#/components/schemas/Problem"}},
                      },
                  },
                  "operations": {"type": "array", "items": {"$ref": "#/components/schemas/Operation"}},
                  "appliedBy": {"type": ["integer", "null"]},
                  "appliedAt": {"type": ["string", "null"], "format": "date-time"},
                  "discardedAt": {"type": ["string", "null"], "format": "date-time"},
                  "expiresAt": {"type": ["string", "null"], "format": "date-time"},
                  "createdAt": {"type": ["string", "null"], "format": "date-time"},
                  "updatedAt": {"type": ["string", "null"], "format": "date-time"},
              },
          }
          envelope_base = {
              "type": "object",
              "required": ["action", "requestId", "context", "payload", "meta"],
              "properties": {
                  "action": {"type": "string"},
                  "requestId": {"type": "string"},
                  "context": {"type": "object", "additionalProperties": True},
                  "payload": {"type": "object"},
                  "meta": {"type": "object", "additionalProperties": True},
              },
          }
          response_envelope = {
              "type": "object",
              "required": ["ok", "requestId", "data", "events", "warnings", "errors"],
              "properties": {
                  "ok": {"type": "boolean"},
                  "requestId": {"type": "string"},
                  "data": {"type": "object"},
                  "events": {"type": "array", "items": {"type": "object"}},
                  "warnings": {"type": "array", "items": {"type": "object"}},
                  "errors": {"type": "array", "items": {"$ref": "#/components/schemas/Problem"}},
              },
          }
          def envelope_payload(properties, required=None):
              return {
                  "allOf": [
                      {"$ref": "#/components/schemas/EnvelopeBase"},
                      {
                          "properties": {
                              "payload": {
                                  "type": "object",
                                  "additionalProperties": False,
                                  "properties": properties,
                                  **({"required": required} if required else {}),
                              }
                          }
                      },
                  ]
              }
          def data_envelope(properties, required):
              return {
                  "allOf": [
                      {"$ref": "#/components/schemas/ResponseEnvelope"},
                      {"properties": {"data": {"type": "object", "required": required, "properties": properties}}},
                  ]
              }
          spec = {
              "openapi": "3.1.0",
              "info": {
                  "title": "ReDjango Master AI Proposal API",
                  "version": "1.0.0",
                  "description": "Authenticated proposal-review endpoints outside the generated /api/v1 Django Ninja schema. Mutation endpoints use ReDjango CSRF and action envelopes. The apply endpoint is human-only and is never exposed as an AI tool.",
              },
              "servers": [{"url": "/"}],
              "tags": [{"name": "Master AI proposals"}, {"name": "Master AI entities"}],
              "paths": {
                  "/api/ai/change-sets/": {
                      "get": {
                          "tags": ["Master AI proposals"],
                          "summary": "List owner-scoped proposal summaries",
                          "responses": {"200": response("ChangeSetList"), "401": response("Unauthorized")},
                      },
                      "post": mutation("Create an empty proposal", "EnvelopeChangeSetCreate", status="201"),
                  },
                  "/api/ai/change-sets/{changeSetId}/": {
                      "parameters": [change_set_parameter()],
                      "get": {
                          "tags": ["Master AI proposals"],
                          "summary": "Read an owner-scoped proposal",
                          "responses": {"200": response("ChangeSetDetail"), "404": response("NotFound")},
                      },
                      "patch": mutation("Edit proposal metadata or safe context", "EnvelopeChangeSetUpdate"),
                      "delete": mutation("Discard a proposal without domain writes"),
                  },
                  "/api/ai/change-sets/{changeSetId}/operations/": {
                      "parameters": [change_set_parameter()],
                      "post": mutation("Add a staged create, update, clone, or archive operation", "EnvelopeOperationCreate", status="201"),
                  },
                  "/api/ai/change-sets/{changeSetId}/operations/{operationId}/": {
                      "parameters": [change_set_parameter(), operation_parameter()],
                      "patch": mutation("Edit, select, or reorder an operation", "EnvelopeOperationUpdate"),
                      "delete": mutation("Remove an operation from a mutable proposal"),
                  },
                  "/api/ai/change-sets/{changeSetId}/validate/": {
                      "parameters": [change_set_parameter()],
                      "post": mutation("Validate selected operations and issue a short-lived signed token"),
                  },
                  "/api/ai/change-sets/{changeSetId}/apply/": {
                      "parameters": [change_set_parameter()],
                      "post": {
                          **mutation("Apply all selected operations atomically after explicit human confirmation", "EnvelopeApply"),
                          "description": "Rechecks ownership, role, signed token, revision, selection, values, and target timestamp/digest. Stale conflicts return 409 and clear ready authorization.",
                      },
                  },
                  "/api/ai/change-entities/": {
                      "get": {
                          "tags": ["Master AI entities"],
                          "summary": "List accessible explicit entity handlers",
                          "responses": {"200": response("EntityCatalog"), "403": response("Forbidden")},
                      }
                  },
                  "/api/ai/change-entities/{entityType}/search/": {
                      "get": {
                          "tags": ["Master AI entities"],
                          "summary": "Search minimal manageable records",
                          "parameters": [
                              {"$ref": "#/components/parameters/EntityType"},
                              {"in": "query", "name": "q", "schema": {"type": "string", "maxLength": 160}},
                              {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 25, "default": 10}},
                          ],
                          "responses": {"200": response("EntitySearch"), "403": response("Forbidden"), "404": response("NotFound")},
                      }
                  },
              },
              "components": {
                  "parameters": {
                      "ActionHeader": {"in": "header", "name": "X-ReDjango-Action", "required": True, "schema": {"type": "string"}},
                      "ChangeSetId": {"in": "path", "name": "changeSetId", "required": True, "schema": {"type": "string", "format": "uuid"}},
                      "OperationId": {"in": "path", "name": "operationId", "required": True, "schema": {"type": "integer"}},
                      "EntityType": {"in": "path", "name": "entityType", "required": True, "schema": {"$ref": "#/components/schemas/EntityType"}},
                  },
                  "responses": {
                      "ChangeSetList": {"description": "Proposal summaries", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ChangeSetListEnvelope"}}}},
                      "ChangeSetDetail": {"description": "Complete proposal", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ChangeSetEnvelope"}}}},
                      "EntityCatalog": {"description": "Accessible handlers", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EntityCatalogEnvelope"}}}},
                      "EntitySearch": {"description": "Minimal records", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EntitySearchEnvelope"}}}},
                      "Error": {"description": "Validation or envelope error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}},
                      "Unauthorized": {"description": "Authentication required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}},
                      "Forbidden": {"description": "Role or domain permission denied", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}},
                      "NotFound": {"description": "Owner-scoped resource or supported record not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}},
                      "Conflict": {"description": "Immutable, stale, token, replay, or selection conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}},
                  },
                  "requestBodies": {
                      "ChangeSetCreate": request_body("EnvelopeChangeSetCreate"),
                      "ChangeSetUpdate": request_body("EnvelopeChangeSetUpdate"),
                      "OperationCreate": request_body("EnvelopeOperationCreate"),
                      "OperationUpdate": request_body("EnvelopeOperationUpdate"),
                      "Apply": request_body("EnvelopeApply"),
                  },
                  "schemas": {
                      "EntityType": {"type": "string", "enum": ["item", "skill", "spell", "theme"]},
                      "SafeContext": safe_context,
                      "Problem": problem,
                      "FieldSchema": field_schema,
                      "Operation": operation_schema,
                      "ChangeSet": change_set,
                      "EnvelopeBase": envelope_base,
                      "EnvelopeChangeSetCreate": envelope_payload({"title": {"type": "string", "maxLength": 160}, "requestText": {"type": "string", "maxLength": 8000}, "context": {"$ref": "#/components/schemas/SafeContext"}}),
                      "EnvelopeChangeSetUpdate": envelope_payload({"title": {"type": "string", "maxLength": 160}, "requestText": {"type": "string", "maxLength": 8000}, "context": {"$ref": "#/components/schemas/SafeContext"}}),
                      "EnvelopeOperationCreate": envelope_payload({"entityType": {"$ref": "#/components/schemas/EntityType"}, "action": {"type": "string", "enum": ["create", "update", "archive"]}, "values": {"type": "object", "additionalProperties": True}, "targetId": {"type": ["integer", "null"]}, "sourceId": {"type": ["integer", "null"]}, "selected": {"type": "boolean"}}, ["entityType", "action", "values"]),
                      "EnvelopeOperationUpdate": envelope_payload({"editedValues": {"type": "object", "additionalProperties": True}, "selected": {"type": "boolean"}, "position": {"type": "integer", "minimum": 0}}),
                      "EnvelopeApply": envelope_payload({"token": {"type": "string"}}, ["token"]),
                      "ResponseEnvelope": response_envelope,
                      "ChangeSetEnvelope": data_envelope({"changeSet": {"$ref": "#/components/schemas/ChangeSet"}, "operationId": {"type": "integer"}}, ["changeSet"]),
                      "ChangeSetListEnvelope": data_envelope({"changeSets": {"type": "array", "items": {"$ref": "#/components/schemas/ChangeSet"}}}, ["changeSets"]),
                      "EntityCatalogEnvelope": data_envelope({"entities": {"type": "array", "items": {"type": "object", "additionalProperties": True}}}, ["entities"]),
                      "EntitySearchEnvelope": data_envelope({"results": {"type": "array", "items": {"type": "object", "additionalProperties": True}}}, ["results"]),
                      "ErrorEnvelope": {"allOf": [{"$ref": "#/components/schemas/ResponseEnvelope"}, {"properties": {"ok": {"const": False}}}]},
                  },
              },
          }
          path = Path("Builder_docs/openapi-master-ai-proposals.json")
          path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          json.loads(path.read_text(encoding="utf-8"))
          PY
          python /tmp/generate_master_ai_openapi.py
          rm .github/workflows/fix-master-ai-openapi.yml
      - name: Commit validated contract and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Builder_docs/openapi-master-ai-proposals.json .github/workflows/fix-master-ai-openapi.yml
          git commit -m "Regenerate Master AI OpenAPI contract"
          git push origin HEAD:agent/master-ai-proposal-system
