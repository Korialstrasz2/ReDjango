name: Fix Master AI backend compatibility

on:
  push:
    branches:
      - agent/master-ai-proposal-system
    paths:
      - ".github/workflows/fix-master-ai-backend-compat.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-proposal-system
      - name: Preserve legacy runtime contracts and update tool invariants
        run: |
          python scripts/fix_master_ai_backend_compat.py
          rm scripts/fix_master_ai_backend_compat.py
          rm .github/workflows/fix-master-ai-backend-compat.yml
      - name: Commit compatibility fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ai/master_runtime.py backend/ai/apps.py backend/ai/test_question_coverage.py backend/ai/tests.py scripts/fix_master_ai_backend_compat.py .github/workflows/fix-master-ai-backend-compat.yml
          git commit -m "Preserve AI runtime compatibility"
          git push origin HEAD:agent/master-ai-proposal-system
