name: Apply mobile blocker fixes

on:
  push:
    branches:
      - mobile-optimized
    paths:
      - ".github/workflows/apply-mobile-blocker-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-optimized
          fetch-depth: 0
      - name: Apply reviewed corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              if old not in content:
                  raise SystemExit(f"Expected source not found in {path}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern[:100]!r}")
              write(path, updated)

          # 1. Preserve the original desktop backdrop-close default. Phone sheets and
          # full-screen editors may still infer the stricter mobile default.
          replace_once(
              "frontend/src/components/Modal.tsx",
              "  const backdropClosable = closeOnBackdrop ?? !(wide || resizable || hideHeader || dragFromBody);",
              "  const backdropClosable = closeOnBackdrop ?? (mobilePresentation ? !(wide || resizable || hideHeader || dragFromBody) : true);",
          )

          modal_test = r'''import { act } from "react";
          import { createRoot, type Root } from "react-dom/client";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";

          const responsive = vi.hoisted(() => ({ isPhone: false }));

          vi.mock("../lib/responsive", () => ({
            useResponsiveLayout: () => ({ isPhone: responsive.isPhone }),
          }));

          vi.mock("../lib/surfaces", () => ({
            useSurfaceBackground: () => "",
          }));

          import { Modal } from "./Modal";

          describe("Modal backdrop defaults", () => {
            let host: HTMLDivElement;
            let root: Root;

            beforeEach(() => {
              responsive.isPhone = false;
              host = document.createElement("div");
              document.body.appendChild(host);
              root = createRoot(host);
            });

            afterEach(() => {
              act(() => root.unmount());
              host.remove();
              document.body.innerHTML = "";
              vi.restoreAllMocks();
            });

            function renderModal(onClose: () => void, props: Record<string, boolean> = {}) {
              act(() => {
                root.render(<Modal title="Test" onClose={onClose} {...props}>Contenuto</Modal>);
              });
              return document.querySelector<HTMLElement>(".modal-backdrop")!;
            }

            function clickBackdrop(backdrop: HTMLElement) {
              act(() => {
                backdrop.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
              });
            }

            it("keeps wide and resizable desktop dialogs backdrop-closable by default", () => {
              const onClose = vi.fn();
              const backdrop = renderModal(onClose, { wide: true, resizable: true });
              clickBackdrop(backdrop);
              expect(onClose).toHaveBeenCalledTimes(1);
            });

            it("respects an explicit desktop closeOnBackdrop false", () => {
              const onClose = vi.fn();
              const backdrop = renderModal(onClose, { wide: true, closeOnBackdrop: false });
              clickBackdrop(backdrop);
              expect(onClose).not.toHaveBeenCalled();
            });

            it("keeps the stricter inferred default for phone full-screen editors", () => {
              responsive.isPhone = true;
              const onClose = vi.fn();
              const backdrop = renderModal(onClose, { wide: true });
              clickBackdrop(backdrop);
              expect(onClose).not.toHaveBeenCalled();
            });
          });
          '''
          write("frontend/src/components/Modal.test.tsx", textwrap.dedent(modal_test))

          # 4. Put the unsupported-phone decision in the route guard so management
          # components never mount, query, or attach listeners on phones.
          replace_once(
              "frontend/src/App.tsx",
              'import { activateMediaCache, deactivateMediaCache } from "./lib/mediaCache";\n',
              'import { activateMediaCache, deactivateMediaCache } from "./lib/mediaCache";\nimport { useResponsiveLayout } from "./lib/responsive";\n',
          )
          regex_once(
              "frontend/src/App.tsx",
              r'''function GameManagerOnly\(\{ children \}: \{ children: ReactNode \}\) \{.*?function AdminOnly\(\{ children \}: \{ children: ReactNode \}\) \{.*?\n\}''',
              '''function UnsupportedManagementScreen() {
            const navigate = useNavigate();
            const goBack = () => {
              const historyIndex = Number((window.history.state as { idx?: number } | null)?.idx ?? 0);
              if (historyIndex > 0) navigate(-1);
              else navigate("/", { replace: true });
            };
            return <section className="mobile-unsupported-management" aria-labelledby="mobile-management-title">
              <div>
                <span aria-hidden="true">▣</span>
                <p className="eyebrow">Layout non supportato su telefono</p>
                <h1 id="mobile-management-title">Gestione richiede un tablet o un computer</h1>
                <p>Questo indirizzo è stato conservato, ma la postazione di gestione non viene caricata sul telefono.</p>
                <div>
                  <button type="button" className="button secondary" onClick={goBack}>Indietro</button>
                  <Link className="button primary" to="/">Torna alla Home</Link>
                </div>
              </div>
            </section>;
          }

          function GameManagerOnly({ children }: { children: ReactNode }) {
            const { settings } = useApp();
            const { isPhone } = useResponsiveLayout();
            if (!settings.security.canManageGameData) return <Navigate to="/" replace />;
            return isPhone ? <UnsupportedManagementScreen /> : children;
          }

          function AdminOnly({ children }: { children: ReactNode }) {
            const { settings } = useApp();
            const { isPhone } = useResponsiveLayout();
            if (!settings.security.canManageAdminSettings) return <Navigate to="/" replace />;
            return isPhone ? <UnsupportedManagementScreen /> : children;
          }''',
          )

          replace_once(
              "frontend/src/features/mobile/MobileNavigation.tsx",
              'import { Link, useLocation, useNavigate } from "react-router-dom";',
              'import { Link, useLocation } from "react-router-dom";',
          )
          replace_once(
              "frontend/src/features/mobile/MobileNavigation.tsx",
              "  const navigate = useNavigate();\n",
              "",
          )
          regex_once(
              "frontend/src/features/mobile/MobileNavigation.tsx",
              r'''\n  useEffect\(\(\) => \{\n    if \(managementBlocked\) document\.documentElement\.dataset\.mobileManagementBlocked = "true";.*?\n  \}, \[managementBlocked\]\);\n''',
              "\n",
          )
          regex_once(
              "frontend/src/features/mobile/MobileNavigation.tsx",
              r'''\n  const goBackFromManagement = \(\) => \{.*?\n  \};\n''',
              "\n",
          )
          regex_once(
              "frontend/src/features/mobile/MobileNavigation.tsx",
              r'''\n    \{managementBlocked && <main className="mobile-unsupported-management".*?</main>\}\n''',
              "\n",
          )

          mobile_css = read("frontend/src/styles/mobile.css")
          mobile_css = mobile_css.replace(
              '''  html[data-mobile-management-blocked="true"] .workspace-content {
            visibility: hidden;
          }

          ''',
              "",
              1,
          )
          old_management_css = '''  .mobile-unsupported-management {
            position: fixed;
            top: calc(var(--mobile-app-bar-height) + var(--mobile-safe-top));
            right: 0;
            bottom: calc(var(--mobile-bottom-nav-height) + var(--mobile-safe-bottom));
            left: 0;
            z-index: 55;
            display: grid;
            place-items: center;
            overflow: auto;
            padding: 24px max(18px, var(--mobile-safe-right)) 24px max(18px, var(--mobile-safe-left));
            background: linear-gradient(var(--theme-background-veil), var(--theme-background-veil)), var(--background);
          }
          '''
          new_management_css = '''  .mobile-unsupported-management {
            display: grid;
            min-height: calc(100dvh - var(--mobile-app-bar-height) - var(--mobile-safe-top) - var(--mobile-bottom-nav-height) - var(--mobile-safe-bottom));
            place-items: center;
            overflow: auto;
            padding: 24px max(18px, var(--mobile-safe-right)) 24px max(18px, var(--mobile-safe-left));
          }
          '''
          if old_management_css not in mobile_css:
              raise SystemExit("Management CSS source block not found")
          mobile_css = mobile_css.replace(old_management_css, new_management_css, 1)

          workspace_css = '''  html[data-mobile-workspace] .mobile-app-bar {
            display: none;
          }

          .mobile-workspace-bar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 87;
            display: grid;
            grid-template-columns: minmax(104px, auto) minmax(0, 1fr) var(--mobile-touch-target);
            align-items: center;
            gap: 10px;
            min-height: calc(var(--mobile-app-bar-height) + var(--mobile-safe-top));
            padding: calc(7px + var(--mobile-safe-top)) calc(10px + var(--mobile-safe-right)) 7px calc(10px + var(--mobile-safe-left));
            border-bottom: 1px solid var(--line);
            background: var(--theme-overlay-strong-surface);
            box-shadow: 0 8px 24px #0005;
            backdrop-filter: blur(14px);
          }

          .mobile-workspace-back {
            display: inline-flex;
            min-width: 104px;
            min-height: var(--mobile-touch-target);
            align-items: center;
            justify-content: flex-start;
            gap: 7px;
            padding: 6px 10px;
            border: 1px solid color-mix(in srgb, var(--gold), transparent 40%);
            border-radius: 9px;
            background: var(--theme-overlay-surface);
            color: var(--gold);
            cursor: pointer;
            font: inherit;
          }

          .mobile-workspace-back > span {
            font-size: 1.1rem;
          }

          .mobile-workspace-back > strong {
            overflow: hidden;
            font-size: .74rem;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .mobile-workspace-title {
            min-width: 0;
            text-align: center;
          }

          .mobile-workspace-title small,
          .mobile-workspace-title strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .mobile-workspace-title small {
            color: var(--muted);
            font-size: .58rem;
            text-transform: uppercase;
            letter-spacing: .08em;
          }

          .mobile-workspace-title strong {
            margin-top: 2px;
            font-family: var(--font-display);
            font-size: .94rem;
          }

          .mobile-workspace-actions {
            display: grid;
            width: var(--mobile-touch-target);
            min-width: var(--mobile-touch-target);
            min-height: var(--mobile-touch-target);
            place-items: center;
          }

          '''
          marker = "  .mobile-bottom-navigation {\n"
          if marker not in mobile_css:
              raise SystemExit("Mobile bottom navigation CSS marker not found")
          mobile_css = mobile_css.replace(marker, workspace_css + marker, 1)
          write("frontend/src/styles/mobile.css", mobile_css)

          # 5. Shared workspace Back primitive: top modal first, then route-specific
          # child state, then router history with a direct-entry Home fallback.
          workspace_bar = r'''import { type ReactNode, useEffect } from "react";
          import type { NavigateFunction } from "react-router-dom";

          type Props = {
            workspace: "combat" | "travel";
            title: string;
            backLabel?: string;
            navigate: NavigateFunction;
            onBeforeNavigate?: () => boolean;
            actions?: ReactNode;
          };

          export function closeTopWorkspaceDialog(): boolean {
            const top = document.querySelector<HTMLElement>("[data-modal-instance][data-modal-top]")
              || Array.from(document.querySelectorAll<HTMLElement>("[data-modal-instance]")).at(-1)
              || null;
            const close = top?.querySelector<HTMLButtonElement>(".modal-header [aria-label='Chiudi']");
            if (!close) return false;
            close.click();
            return true;
          }

          export function navigateBackOrHome(navigate: NavigateFunction) {
            const historyIndex = Number((window.history.state as { idx?: number } | null)?.idx ?? 0);
            if (historyIndex > 0) navigate(-1);
            else navigate("/", { replace: true });
          }

          export function MobileWorkspaceBar({ workspace, title, backLabel = "Indietro", navigate, onBeforeNavigate, actions }: Props) {
            useEffect(() => {
              const root = document.documentElement;
              const previous = root.dataset.mobileWorkspace;
              root.dataset.mobileWorkspace = workspace;
              return () => {
                if (previous) root.dataset.mobileWorkspace = previous;
                else delete root.dataset.mobileWorkspace;
              };
            }, [workspace]);

            const goBack = () => {
              if (closeTopWorkspaceDialog()) return;
              if (onBeforeNavigate?.()) return;
              navigateBackOrHome(navigate);
            };

            return <header className="mobile-workspace-bar" data-mobile-workspace-bar={workspace}>
              <button type="button" className="mobile-workspace-back" aria-label={`Indietro da ${title}`} onClick={goBack}>
                <span aria-hidden="true">←</span>
                <strong>{backLabel}</strong>
              </button>
              <div className="mobile-workspace-title">
                <small>Spazio mobile</small>
                <strong>{title}</strong>
              </div>
              <div className="mobile-workspace-actions">{actions}</div>
            </header>;
          }
          '''
          write("frontend/src/features/mobile/MobileWorkspaceBar.tsx", textwrap.dedent(workspace_bar))

          replace_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              'import { useLocation } from "react-router-dom";',
              'import { useLocation, useNavigate } from "react-router-dom";',
          )
          replace_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              'import { useResponsiveLayout } from "../../lib/responsive";\n',
              'import { useResponsiveLayout } from "../../lib/responsive";\nimport { MobileWorkspaceBar, navigateBackOrHome } from "./MobileWorkspaceBar";\n',
          )
          replace_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              "  const location = useLocation();\n",
              "  const location = useLocation();\n  const navigate = useNavigate();\n",
          )
          replace_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              "  const navRef = useRef<HTMLElement>(null);\n\n",
              '''  const navRef = useRef<HTMLElement>(null);

            const closeCombatChild = () => {
              const hexClose = document.querySelector<HTMLButtonElement>(".combat-hex-tool-window [aria-label='Chiudi strumenti esagono']");
              if (hexClose) {
                hexClose.click();
                return true;
              }
              if (panel !== "map") {
                setPanel("map");
                window.setTimeout(() => navRef.current?.querySelector<HTMLButtonElement>("[data-combat-mobile-panel='map']")?.focus(), 0);
                return true;
              }
              return false;
            };

          ''',
          )
          regex_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              r'''  useEffect\(\(\) => \{\n    if \(!enabled\) return;\n    const onKeyDown = \(event: KeyboardEvent\) => \{\n      if \(event\.key !== "Escape"\) return;.*?\n  \}, \[enabled, panel\]\);''',
              '''  useEffect(() => {
            if (!enabled) return;
            const onKeyDown = (event: KeyboardEvent) => {
              if (event.key !== "Escape" || event.defaultPrevented) return;
              // Modal owns Escape while present. The workspace Back contract handles
              // the non-modal inspector, active panel, and finally route history.
              if (document.querySelector(".modal-backdrop")) return;
              event.preventDefault();
              if (closeCombatChild()) return;
              navigateBackOrHome(navigate);
            };
            document.addEventListener("keydown", onKeyDown, true);
            return () => document.removeEventListener("keydown", onKeyDown, true);
          }, [enabled, navigate, panel]);''',
          )
          replace_once(
              "frontend/src/features/mobile/CombatMobileRuntime.tsx",
              '''  return <nav ref={navRef} className="combat-mobile-navigation" role="tablist" aria-label="Pannelli del combattimento">
            {tabs.map((tab) => <button
              key={tab.id}
              type="button"
              role="tab"
              data-combat-mobile-panel={tab.id}
              aria-selected={panel === tab.id}
              disabled={tab.disabled}
              className={panel === tab.id ? "active" : ""}
              onClick={() => choosePanel(tab.id)}
            ><span aria-hidden="true">{tab.icon}</span><strong>{tab.label}</strong></button>)}
          </nav>;''',
              '''  return <>
            <MobileWorkspaceBar
              workspace="combat"
              title="Combattimento"
              navigate={navigate}
              onBeforeNavigate={closeCombatChild}
            />
            <nav ref={navRef} className="combat-mobile-navigation" role="tablist" aria-label="Pannelli del combattimento">
              {tabs.map((tab) => <button
                key={tab.id}
                type="button"
                role="tab"
                data-combat-mobile-panel={tab.id}
                aria-selected={panel === tab.id}
                disabled={tab.disabled}
                className={panel === tab.id ? "active" : ""}
                onClick={() => choosePanel(tab.id)}
              ><span aria-hidden="true">{tab.icon}</span><strong>{tab.label}</strong></button>)}
            </nav>
          </>;''',
          )

          replace_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              'import { useLocation } from "react-router-dom";',
              'import { useLocation, useNavigate } from "react-router-dom";',
          )
          replace_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              'import { useResponsiveLayout } from "../../lib/responsive";\n',
              'import { useResponsiveLayout } from "../../lib/responsive";\nimport { MobileWorkspaceBar, navigateBackOrHome } from "./MobileWorkspaceBar";\n',
          )
          replace_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              "  const location = useLocation();\n",
              "  const location = useLocation();\n  const navigate = useNavigate();\n",
          )
          replace_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              "  const controlsTriggerRef = useRef<HTMLButtonElement>(null);\n\n",
              '''  const controlsTriggerRef = useRef<HTMLButtonElement>(null);

            const closeTravelChild = () => {
              if (controlsOpen) {
                setControlsOpen(false);
                window.setTimeout(() => controlsTriggerRef.current?.focus(), 0);
                return true;
              }
              if (markerPlacement) {
                setMarkerPlacement(null);
                return true;
              }
              return false;
            };

          ''',
          )
          regex_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              r'''  useEffect\(\(\) => \{\n    if \(!enabled\) return;\n    const onKeyDown = \(event: KeyboardEvent\) => \{.*?\n  \}, \[controlsOpen, enabled, markerPlacement\]\);''',
              '''  useEffect(() => {
            if (!enabled) return;
            const onKeyDown = (event: KeyboardEvent) => {
              if (event.key === "Escape") {
                if (event.defaultPrevented || document.querySelector(".modal-backdrop")) return;
                event.preventDefault();
                if (closeTravelChild()) return;
                navigateBackOrHome(navigate);
                return;
              }
              if (!controlsOpen || event.key !== "Tab") return;
              const controls = visibleControls();
              if (!controls.length) return;
              const first = controls[0];
              const last = controls[controls.length - 1];
              if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
              } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
              }
            };
            document.addEventListener("keydown", onKeyDown, true);
            return () => document.removeEventListener("keydown", onKeyDown, true);
          }, [controlsOpen, enabled, markerPlacement, navigate]);''',
          )
          replace_once(
              "frontend/src/features/mobile/TravelMobileRuntime.tsx",
              "  return <>\n    <div className=\"travel-mobile-toolbar\"",
              '''  return <>
            <MobileWorkspaceBar
              workspace="travel"
              title="Viaggio"
              navigate={navigate}
              onBeforeNavigate={closeTravelChild}
            />
            <div className="travel-mobile-toolbar"''',
          )

          # Route guard and Back-contract tests.
          replace_once(
              "frontend/tests/mobile-baseline.spec.ts",
              '  await expect(page.locator(".workspace-content")).toBeHidden();',
              '  await expect(page.locator(".workspace-content")).toBeVisible();\n  await expect(page.locator(".management-page")).toHaveCount(0);\n  await expect(page.locator(".management-launcher")).toHaveCount(0);',
          )
          replace_once(
              "frontend/tests/mobile-combat.spec.ts",
              '  await expect(navigation).toBeVisible();\n',
              '  await expect(navigation).toBeVisible();\n  await expect(page.getByRole("button", { name: "Indietro da Combattimento" })).toBeVisible();\n',
          )
          combat_back_test = r'''

          test("phone Combat Back closes child state before leaving the workspace", async ({ page }, testInfo) => {
            test.skip(!isPhoneProject(testInfo.project.name), "Phone-only Combat Back contract");
            await ensureCombatMap(page);

            const back = page.getByRole("button", { name: "Indietro da Combattimento" });
            const navigation = page.getByRole("tablist", { name: "Pannelli del combattimento" });
            await navigation.getByRole("tab", { name: /Attivi/ }).click();
            await expect(page.locator("html")).toHaveAttribute("data-mobile-combat-panel", "roster");
            await back.click();
            await expect(page).toHaveURL(/\/combat$/);
            await expect(page.locator("html")).toHaveAttribute("data-mobile-combat-panel", "map");

            const hexLauncher = page.locator(".combat-hex-tool-launcher");
            if (await hexLauncher.count()) {
              await hexLauncher.click();
              await expect(page.locator(".combat-hex-tool-window")).toBeVisible();
              await back.click();
              await expect(page.locator(".combat-hex-tool-window")).toHaveCount(0);
              await expect(page).toHaveURL(/\/combat$/);
            }

            await back.click();
            await expect(page).toHaveURL(/\/$/);
          });
          '''
          replace_once(
              "frontend/tests/mobile-combat.spec.ts",
              '\ntest("tablet Combat releases forced map width without phone navigation"',
              textwrap.dedent(combat_back_test) + '\ntest("tablet Combat releases forced map width without phone navigation"',
          )

          replace_once(
              "frontend/tests/mobile-travel.spec.ts",
              '  await expect(toolbar).toBeVisible();\n',
              '  await expect(toolbar).toBeVisible();\n  await expect(page.getByRole("button", { name: "Indietro da Viaggio" })).toBeVisible();\n',
          )
          travel_back_test = r'''

          test("phone Travel Back closes controls and pending placement before leaving", async ({ page }, testInfo) => {
            test.skip(!isPhoneProject(testInfo.project.name), "Phone-only Travel Back contract");
            await openTravel(page);

            const back = page.getByRole("button", { name: "Indietro da Viaggio" });
            const toolbar = page.locator(".travel-mobile-toolbar");
            await toolbar.getByRole("button", { name: "Controlli" }).click();
            await expect(page.locator(".travel-sidebar")).toBeVisible();
            await back.click();
            await expect(page.locator(".travel-sidebar")).toBeHidden();
            await expect(page).toHaveURL(/\/travel$/);

            await back.click();
            await expect(page).toHaveURL(/\/$/);
          });
          '''
          replace_once(
              "frontend/tests/mobile-travel.spec.ts",
              '\ntest("desktop Travel retains the existing sidebar and two-column workspace"',
              textwrap.dedent(travel_back_test) + '\ntest("desktop Travel retains the existing sidebar and two-column workspace"',
          )

          # 2. Separate the complete canonical desktop suite from the mobile matrix.
          # 3. Generate screenshots from the pinned main commit in each CI run, then
          # compare the candidate at three protected desktop viewports.
          visual_config = r'''import { defineConfig } from "@playwright/test";

          const runtimePlatform = (globalThis as typeof globalThis & { process?: { platform?: string } }).process?.platform || "";
          const python = runtimePlatform.startsWith("win") ? "..\\venv\\Scripts\\python.exe" : "python";
          const django = (command: string) => `${python} ../manage.py ${command}`;
          const authenticatedState = ".playwright/desktop-visual-auth.json";

          export default defineConfig({
            testDir: "./tests",
            testMatch: /desktop-visual-baseline\.spec\.ts/,
            fullyParallel: false,
            workers: 1,
            expect: {
              toHaveScreenshot: {
                animations: "disabled",
                caret: "hide",
                maxDiffPixels: 0,
              },
            },
            use: {
              baseURL: "http://127.0.0.1:8130",
              trace: "retain-on-failure",
              colorScheme: "dark",
            },
            projects: [
              {
                name: "desktop-visual-setup",
                testMatch: /auth\.setup\.ts/,
              },
              {
                name: "desktop-1280",
                dependencies: ["desktop-visual-setup"],
                use: { storageState: authenticatedState, viewport: { width: 1280, height: 800 } },
              },
              {
                name: "desktop-1440",
                dependencies: ["desktop-visual-setup"],
                use: { storageState: authenticatedState, viewport: { width: 1440, height: 900 } },
              },
              {
                name: "desktop-1920",
                dependencies: ["desktop-visual-setup"],
                use: { storageState: authenticatedState, viewport: { width: 1920, height: 1080 } },
              },
            ],
            webServer: {
              command: [
                django("migrate --noinput"),
                django("flush --noinput"),
                django("seed_minimum_data"),
                django("ensure_admin_login"),
                django("runserver 127.0.0.1:8130 --noreload"),
              ].join(" && "),
              env: {
                REDJANGO_ACCESS_MODE: "locked",
                REDJANGO_DATABASE_NAME: "frontend/e2e-desktop-visual.sqlite3",
                REDJANGO_ADMIN_USERNAME: "local_master",
                REDJANGO_ADMIN_PASSWORD: "ReDjango-E2E-only-2026!",
                REDJANGO_ADMIN_GAME_ROLE: "admin",
              },
              url: "http://127.0.0.1:8130/api/auth/session/",
              reuseExistingServer: false,
              timeout: 120000,
            },
          });
          '''
          write("frontend/playwright.desktop-visual.config.ts", textwrap.dedent(visual_config))

          visual_spec = r'''import { expect, test, type Page } from "@playwright/test";

          const STATIC_ROUTES = [
            ["dashboard", "/"],
            ["skills", "/skills"],
            ["competencies", "/competencies"],
            ["creation", "/creation"],
            ["new-character", "/new-character"],
            ["combat", "/combat"],
            ["travel", "/travel"],
            ["market", "/market"],
            ["lore", "/lore"],
            ["media", "/media"],
            ["guides", "/guides"],
            ["settings", "/settings"],
            ["management", "/tools"],
          ] as const;

          async function stabilize(page: Page) {
            await page.waitForLoadState("networkidle").catch(() => undefined);
            await page.addStyleTag({ content: `
              *, *::before, *::after { animation: none !important; transition: none !important; caret-color: transparent !important; }
              .toast { display: none !important; }
            ` });
            await page.evaluate(() => {
              document.documentElement.dataset.reducedMotion = "true";
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(120);
          }

          async function screenshotRoute(page: Page, name: string, path: string) {
            await page.goto(path);
            await expect(page.locator(".fatal-error")).toHaveCount(0);
            await expect(page.locator(".workspace-content")).toBeVisible({ timeout: 20_000 });
            await stabilize(page);
            await expect(page).toHaveScreenshot(`route-${name}.png`, { fullPage: false });
          }

          for (const [name, path] of STATIC_ROUTES) {
            test(`desktop route baseline: ${name}`, async ({ page }) => {
              await screenshotRoute(page, name, path);
            });
          }

          test("desktop route baseline: active character", async ({ page }) => {
            await page.goto("/");
            const response = await page.request.get("/api/personaggi/");
            const body = await response.json();
            const characterId = body.data?.giocatore?.activePersonaggioId || body.data?.personaggi?.[0]?.id;
            test.skip(!characterId, "Seed data has no character");
            await screenshotRoute(page, "character", `/character/${characterId}`);
          });

          test("desktop settings tabs remain pixel-identical", async ({ page }) => {
            await page.goto("/settings");
            const tabs = page.getByRole("tablist", { name: "Sezioni delle impostazioni" }).getByRole("tab");
            const count = await tabs.count();
            for (let index = 0; index < count; index += 1) {
              await tabs.nth(index).click();
              await stabilize(page);
              await expect(page).toHaveScreenshot(`settings-tab-${index}.png`, { fullPage: false });
            }
          });

          test("desktop quick-tool drawers remain pixel-identical", async ({ page }) => {
            await page.goto("/");
            for (const label of ["Diario", "Dadi", "Audio"]) {
              await page.locator(".quick-tools-actions").getByRole("button", { name: new RegExp(label) }).click();
              const drawer = page.locator(".tool-drawer").last();
              await expect(drawer).toBeVisible();
              await stabilize(page);
              await expect(page).toHaveScreenshot(`tool-drawer-${label.toLocaleLowerCase("it")}.png`, { fullPage: false });
              await drawer.getByRole("button", { name: "Chiudi" }).click();
            }
          });

          test("desktop common content modals remain pixel-identical when seeded", async ({ page }) => {
            await page.goto("/media");
            const mediaOpen = page.locator(".media-asset-open").first();
            if (await mediaOpen.count()) {
              await mediaOpen.click();
              await expect(page.locator(".media-preview-modal")).toBeVisible();
              await stabilize(page);
              await expect(page).toHaveScreenshot("modal-media-preview.png", { fullPage: false });
              await page.locator(".media-preview-modal").getByRole("button", { name: "Chiudi" }).click();
            }

            await page.goto("/market");
            const marketItem = page.locator(".market-item-card").first();
            if (await marketItem.count()) {
              await marketItem.click();
              await expect(page.locator(".market-item-modal")).toBeVisible();
              await stabilize(page);
              await expect(page).toHaveScreenshot("modal-market-item.png", { fullPage: false });
            }
          });

          test("desktop density surfaces remain pixel-identical", async ({ page }) => {
            await page.goto("/");
            for (const density of ["spacious", "compact", "condensed"]) {
              await page.evaluate((value) => { document.documentElement.dataset.density = value; }, density);
              await stabilize(page);
              await expect(page).toHaveScreenshot(`dashboard-density-${density}.png`, { fullPage: false });
            }
          });
          '''
          write("frontend/tests/desktop-visual-baseline.spec.ts", textwrap.dedent(visual_spec))

          verification_workflow = r'''name: Mobile optimization verification

          on:
            push:
              branches:
                - mobile-optimized
              paths:
                - "frontend/**"
                - "backend/**"
                - "redjango/**"
                - "manage.py"
                - "requirements.txt"
                - "Builder_docs/MOBILE_*.md"
                - ".github/workflows/mobile-optimization-verification.yml"
            pull_request:
              paths:
                - "frontend/**"
                - "backend/**"
                - "redjango/**"
                - "manage.py"
                - "requirements.txt"
                - "Builder_docs/MOBILE_*.md"
                - ".github/workflows/mobile-optimization-verification.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: mobile-optimization-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            frontend:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              defaults:
                run:
                  working-directory: frontend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
                - name: Install frontend dependencies
                  run: npm ci
                - name: Unit tests
                  run: npm test
                - name: TypeScript
                  run: npm run typecheck
                - name: Production build
                  run: npm run build

            desktop-e2e:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              defaults:
                run:
                  working-directory: frontend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
                - name: Install backend dependencies
                  working-directory: .
                  run: python -m pip install --upgrade pip && pip install -r requirements.txt
                - name: Install frontend dependencies
                  run: npm ci
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Build frontend assets
                  run: npm run build
                - name: Complete canonical desktop suite
                  run: npx playwright test --project=authenticated
                - name: Upload desktop Playwright report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: desktop-playwright-report-${{ github.run_attempt }}
                    path: |
                      frontend/playwright-report
                      frontend/test-results
                    if-no-files-found: ignore
                    retention-days: 14

            responsive-e2e:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              defaults:
                run:
                  working-directory: frontend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
                - name: Install backend dependencies
                  working-directory: .
                  run: python -m pip install --upgrade pip && pip install -r requirements.txt
                - name: Check Django configuration
                  working-directory: .
                  env:
                    DJANGO_SETTINGS_MODULE: redjango.settings
                    REDJANGO_DEBUG: "0"
                  run: |
                    python manage.py makemigrations --check --dry-run
                    python manage.py check
                - name: Install frontend dependencies
                  run: npm ci
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Build frontend assets
                  run: npm run build
                - name: Responsive viewport matrix
                  run: >-
                    npx playwright test
                    tests/mobile-baseline.spec.ts
                    tests/mobile-skills.spec.ts
                    tests/mobile-competencies.spec.ts
                    tests/mobile-creation.spec.ts
                    tests/mobile-new-character.spec.ts
                    tests/mobile-character.spec.ts
                    tests/mobile-travel.spec.ts
                    tests/mobile-combat.spec.ts
                    tests/mobile-combat-roles.spec.ts
                - name: Upload responsive Playwright report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: mobile-playwright-report-${{ github.run_attempt }}
                    path: |
                      frontend/playwright-report
                      frontend/test-results
                    if-no-files-found: ignore
                    retention-days: 14

            desktop-visual-regression:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - name: Checkout pinned desktop baseline
                  uses: actions/checkout@v4
                  with:
                    ref: da846aca31d31b15e4128f70b0cf0e6cb3b32283
                    path: baseline
                - name: Checkout candidate
                  uses: actions/checkout@v4
                  with:
                    path: candidate
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: candidate/requirements.txt
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                    cache-dependency-path: |
                      baseline/frontend/package-lock.json
                      candidate/frontend/package-lock.json
                - name: Install backend dependencies
                  run: python -m pip install --upgrade pip && pip install -r candidate/requirements.txt
                - name: Install baseline frontend dependencies
                  working-directory: baseline/frontend
                  run: npm ci
                - name: Install candidate frontend dependencies
                  working-directory: candidate/frontend
                  run: npm ci
                - name: Install Chromium
                  working-directory: candidate/frontend
                  run: npx playwright install --with-deps chromium
                - name: Copy protected visual harness into baseline checkout
                  run: |
                    cp candidate/frontend/playwright.desktop-visual.config.ts baseline/frontend/playwright.desktop-visual.config.ts
                    cp candidate/frontend/tests/desktop-visual-baseline.spec.ts baseline/frontend/tests/desktop-visual-baseline.spec.ts
                    cp candidate/frontend/tests/auth.setup.ts baseline/frontend/tests/auth.setup.ts
                - name: Build pinned baseline
                  working-directory: baseline/frontend
                  run: npm run build
                - name: Generate screenshots from pinned main
                  working-directory: baseline/frontend
                  run: npx playwright test --config=playwright.desktop-visual.config.ts --update-snapshots
                - name: Copy pinned screenshots to candidate
                  run: |
                    rm -rf candidate/frontend/tests/desktop-visual-baseline.spec.ts-snapshots
                    cp -R baseline/frontend/tests/desktop-visual-baseline.spec.ts-snapshots candidate/frontend/tests/
                - name: Build candidate
                  working-directory: candidate/frontend
                  run: npm run build
                - name: Compare candidate with pinned desktop baseline
                  working-directory: candidate/frontend
                  run: npx playwright test --config=playwright.desktop-visual.config.ts
                - name: Upload desktop visual evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: desktop-visual-evidence-${{ github.run_attempt }}
                    path: |
                      baseline/frontend/tests/desktop-visual-baseline.spec.ts-snapshots
                      candidate/frontend/test-results
                      candidate/frontend/playwright-report
                    if-no-files-found: ignore
                    retention-days: 14
          '''
          write(".github/workflows/mobile-optimization-verification.yml", textwrap.dedent(verification_workflow))

          status_path = "Builder_docs/MOBILE_IMPLEMENTATION_STATUS.md"
          status = read(status_path)
          note = '''

          ## Blocking-review corrections

          - Restored the original desktop Modal backdrop-close default; stricter inferred dismissal remains phone-scoped.
          - Added a separate complete `authenticated` desktop Playwright job.
          - Added pinned `main` versus candidate screenshot comparison at 1280×800, 1440×900, and 1920×1080, including all player routes, management, settings tabs, quick-tool drawers, seeded content modals, and density states.
          - Moved unsupported phone management handling into permission-preserving route guards so management pages do not mount.
          - Added a shared explicit mobile workspace Back bar for Combat and Travel with modal/child-panel-first handling, router history, direct-entry Home fallback, and hardware Escape parity.
          '''
          if "## Blocking-review corrections" not in status:
              write(status_path, status.rstrip() + textwrap.dedent(note))

          # This workflow is intentionally one-shot. Remove it in the resulting fix commit.
          (ROOT / ".github/workflows/apply-mobile-blocker-fixes.yml").unlink()
          PY
      - name: Verify patch shape
        run: |
          git diff --check
          test ! -e .github/workflows/apply-mobile-blocker-fixes.yml
          git status --short
      - name: Commit reviewed corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix mobile blocker findings"
          git push origin HEAD:mobile-optimized
