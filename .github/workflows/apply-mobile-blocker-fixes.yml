name: Apply mobile blocker fixes

on:
  push:
    branches:
      - mobile-optimized
    paths:
      - ".github/workflows/apply-mobile-blocker-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-optimized
          fetch-depth: 2
      - name: Run reviewed patch from parent commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/apply-mobile-blocker-fixes.yml"
          source = subprocess.check_output(["git", "show", f"HEAD^:{workflow}"], text=True)
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in source or end not in source:
              raise SystemExit("Parent patch payload was not found")
          body = source.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(script, workflow, "exec"), {"__name__": "__main__"})
          PY
      - name: Verify patch shape
        run: |
          git diff --check
          test ! -e .github/workflows/apply-mobile-blocker-fixes.yml
          git status --short
      - name: Commit reviewed corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix mobile blocker findings"
          git push origin HEAD:mobile-optimized
