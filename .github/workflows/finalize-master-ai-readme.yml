name: Finalize Master AI README

on:
  push:
    branches:
      - agent/master-ai-proposal-system
    paths:
      - ".github/workflows/finalize-master-ai-readme.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-proposal-system
      - name: Insert Master AI documentation without replacing existing README content
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          marker = "## Master AI · proposte controllate"
          if marker not in content:
              assistant = "- Assistente AI con gestione protetta per Master/Amministratori, cataloghi modelli letti dai provider, controlli coerenti con le capacità del modello e indicatori di configurazione pronta. Chat e immagini lavorano in background con avanzamento, annullamento e limiti di tempo/token/strumenti; ogni utente conserva soltanto le ultime tre conversazioni."
              master_ai_bullet = "- **Master AI** per Master e Amministratori: agenti in modalità Proposte possono cercare record e preparare una coda persistita per Item, Skill, Spell e, solo per Admin, Theme. Il modello non applica mai le modifiche: `/tools/master-ai` mostra campi, scelte server, diff, errori e avvisi; soltanto l'utente può convalidare, applicare atomicamente o scartare."
              if assistant not in content:
                  raise SystemExit("Anchor bullet not found; README was not modified.")
              content = content.replace(assistant, assistant + "\n" + master_ai_bullet, 1)

              section = '''## Master AI · proposte controllate

`/tools/ai` configura provider e agenti. Un agente `read_only` conserva il comportamento di sola consultazione; un agente `proposer`, disponibile da Master in su, può usare strumenti separati che scrivono esclusivamente `AIChangeSet` e `AIChangeOperation`.

La revisione avviene in `/tools/master-ai`:

1. il Master AI cerca e legge record accessibili;
2. crea operazioni di creazione, clone, modifica o archiviazione;
3. l'utente controlla il diff e può modificare i campi proposti;
4. la convalida server-side produce un token firmato e temporaneo;
5. un POST umano separato applica tutte le operazioni selezionate in una sola transazione, oppure nessuna;
6. scarto, applicazione e scadenza lasciano un riepilogo di audit in sola lettura.

I launcher contestuali sono presenti soltanto in Gestione Oggetti, Gestione Skill/Spell e, per gli Admin, Gestione Temi. I parametri URL sono suggerimenti: il backend rivalida tipo, record e ruolo. Non esiste un launcher generico per Unit, Negozi, Personaggi, Player, Variabili o impostazioni arbitrarie.

Endpoint principali:

```text
GET/POST       /api/ai/change-sets/
GET/PATCH/DELETE /api/ai/change-sets/<uuid>/
POST           /api/ai/change-sets/<uuid>/operations/
PATCH/DELETE   /api/ai/change-sets/<uuid>/operations/<id>/
POST           /api/ai/change-sets/<uuid>/validate/
POST           /api/ai/change-sets/<uuid>/apply/
GET            /api/ai/change-entities/
GET            /api/ai/change-entities/<type>/search/
```

Manutenzione manuale delle proposte abbandonate:

```bat
venv\\Scripts\\python.exe manage.py cleanup_ai_change_sets --dry-run
venv\\Scripts\\python.exe manage.py cleanup_ai_change_sets --review-days 14 --empty-days 2
```

La documentazione tecnica completa, inclusi sicurezza, token, concorrenza, osservabilità, estensione dei handler e verifica, è in `docs/MASTER_AI_PROPOSALS.md`. Il contratto degli endpoint legacy `/api/ai` è versionato separatamente in `Builder_docs/openapi-master-ai-proposals.json`; il contratto generato `Builder_docs/openapi-v1.json` continua a descrivere l'API Ninja `/api/v1`.

'''
              anchor = "## Backup amministrativi"
              if anchor not in content:
                  raise SystemExit("Section anchor not found; README was not modified.")
              content = content.replace(anchor, section + anchor, 1)

              structure_anchor = "backend/api_v1/                 contratti Ninja/OpenAPI e action dispatcher"
              structure_lines = "backend/ai/changes/              proposal kernel, handler espliciti, token e apply atomico\nbackend/ai/master_runtime.py        modalità proposer e strumenti AI isolati\nfrontend/src/features/master-ai/  workspace centrale e launcher contestuali\ndocs/MASTER_AI_PROPOSALS.md       sicurezza, uso, manutenzione ed estensione\n"
              content = content.replace(structure_anchor, structure_anchor + "\n" + structure_lines, 1)
              path.write_text(content, encoding="utf-8")
          PY
          rm .github/workflows/finalize-master-ai-readme.yml
      - name: Commit README update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/finalize-master-ai-readme.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Document Master AI proposal workflow"
          git push origin HEAD:agent/master-ai-proposal-system
