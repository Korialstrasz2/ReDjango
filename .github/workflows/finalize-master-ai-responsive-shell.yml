name: Finalize Master AI responsive shell

on:
  push:
    branches:
      - agent/master-ai-shell-workspace
    paths:
      - ".github/workflows/finalize-master-ai-responsive-shell.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-shell-workspace
      - name: Add route marker and responsive shell constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          app_path = Path("frontend/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          state_anchor = '  const screen = screenFromPath(location.pathname);\n  const background = settings.theme?.backgrounds?.[screen] || "";'
          state_replacement = '  const screen = screenFromPath(location.pathname);\n  const isMasterAIWorkspace = location.pathname === "/tools/master-ai" || location.pathname.startsWith("/tools/master-ai/");\n  const background = settings.theme?.backgrounds?.[screen] || "";'
          if state_anchor not in app:
              raise SystemExit("Shell state anchor not found")
          app = app.replace(state_anchor, state_replacement, 1)

          shell_anchor = '    <div className="app-shell" data-component-type="app-shell" data-theme={settings.theme?.slug || "default"}>'
          shell_replacement = '    <div className={`app-shell ${isMasterAIWorkspace ? "master-ai-app-shell" : ""}`} data-component-type="app-shell" data-theme={settings.theme?.slug || "default"}>'
          if shell_anchor not in app:
              raise SystemExit("App shell anchor not found")
          app = app.replace(shell_anchor, shell_replacement, 1)

          workspace_anchor = '      <main key={`${location.key}:${background}`} className={`workspace ${background ? "theme-reveal-surface" : ""}`} data-screen={screen} style={{ "--screen-background": background ? `url(${background})` : "none" } as CSSProperties}>'
          workspace_replacement = '      <main key={`${location.key}:${background}`} className={`workspace ${isMasterAIWorkspace ? "master-ai-workspace" : ""} ${background ? "theme-reveal-surface" : ""}`} data-screen={screen} style={{ "--screen-background": background ? `url(${background})` : "none" } as CSSProperties}>'
          if workspace_anchor not in app:
              raise SystemExit("Workspace anchor not found")
          app = app.replace(workspace_anchor, workspace_replacement, 1)
          app_path.write_text(app, encoding="utf-8")

          css = base64.b64decode("").decode("utf-8")
          Path("frontend/src/styles/master-ai-shell.css").write_text(css, encoding="utf-8")
          Path(".github/workflows/finalize-master-ai-responsive-shell.yml").unlink()
          PY
      - name: Commit responsive shell fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow Master AI workspace to shrink in the app shell"
          git push origin HEAD:agent/master-ai-shell-workspace
