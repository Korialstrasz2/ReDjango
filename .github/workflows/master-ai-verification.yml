name: Master AI verification

on:
  pull_request:
    paths:
      - "backend/ai/**"
      - "backend/core/**"
      - "backend/combat/unit_*.py"
      - "backend/combat/accessory_profiles.py"
      - "frontend/src/features/master-ai/**"
      - "frontend/src/features/management/**"
      - "frontend/tests/master-ai.spec.ts"
      - "frontend/playwright.config.ts"
      - "frontend/src/main.tsx"
      - "frontend/src/styles/master-ai*.css"
      - "Builder_docs/openapi-master-ai-proposals.json"
      - "Builder_docs/UNIT_AUTHORING_GUIDE_FOR_LLM.md"
      - "docs/MASTER_AI_PROPOSALS.md"
      - "docs/MASTER_AI_UNITS.md"
      - "requirements.txt"
      - "frontend/package*.json"
      - ".github/workflows/master-ai-verification.yml"
  push:
    branches:
      - agent/master-ai-proposal-system

permissions:
  contents: read

concurrency:
  group: master-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SETTINGS_MODULE: redjango.settings
      REDJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate Master AI OpenAPI JSON
        run: python -m json.tool Builder_docs/openapi-master-ai-proposals.json > /dev/null
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Django system checks
        run: python manage.py check
      - name: Master AI and AI regression tests
        run: python manage.py test backend.ai --verbosity 2
      - name: Unit generation regression tests
        run: python manage.py test backend.combat.tests.UnitGenerationTests --verbosity 2
      - name: Core domain regression tests
        run: python manage.py test backend.core --verbosity 1
      - name: Cleanup command dry run
        run: python manage.py cleanup_ai_change_sets --dry-run

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend assets
        run: npm run build
      - name: Master AI browser flow
        run: npx playwright test tests/master-ai.spec.ts --project=authenticated
