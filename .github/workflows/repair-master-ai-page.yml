name: Repair Master AI page source

on:
  push:
    branches:
      - agent/master-ai-shell-workspace
    paths:
      - ".github/workflows/repair-master-ai-page.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-shell-workspace
      - name: Restore truncated source suffix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("frontend/src/features/master-ai/MasterAIPage.tsx")
          text = path.read_text(encoding="utf-8")
          needle = '<li key={`${warning.code}-${index'
          if not text.endswith(needle):
              raise SystemExit("MasterAIPage.tsx does not end at the expected truncation point")

          root = Path(".github/master-ai-repair")
          encoded = "".join(chunk.read_text(encoding="ascii") for chunk in sorted(root.glob("suffix.*.b64")))
          if not encoded:
              raise SystemExit("Repair payload is missing")
          suffix = base64.b64decode(encoded).decode("utf-8")
          path.write_text(text + suffix, encoding="utf-8")

          for chunk in root.iterdir():
              chunk.unlink()
          root.rmdir()
          Path(".github/workflows/repair-master-ai-page.yml").unlink()
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair complete Master AI page source"
          git push origin HEAD:agent/master-ai-shell-workspace
