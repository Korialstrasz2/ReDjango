name: Prepare character request removal PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'codex/remove-character-request-settings-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-main
      - name: Apply source-only refactor
        run: |
          python3 .ci-main/.github/scripts/remove_character_request.py
          rm -rf .ci-main
          git diff --check
          python3 -m compileall -q backend
      - name: Validate backend
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run
          python manage.py test backend.core.tests.HierarchicalSettingsTests
      - name: Validate frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Commit changes to pull request
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Alep"
          git config user.email "65488656+Korialstrasz2@users.noreply.github.com"
          git add -A
          git commit -m "refactor(settings): remove character request flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
