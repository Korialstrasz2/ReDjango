name: Repair Master AI proposal selector tail

on:
  push:
    branches:
      - agent/master-ai-shell-workspace
    paths:
      - ".github/workflows/repair-master-ai-tail.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-shell-workspace
      - name: Replace corrupted source tail
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          path = Path("frontend/src/features/master-ai/MasterAIPage.tsx")
          text = path.read_text(encoding="utf-8")
          marker = '<option value="">Nessuna proposta</option>{(recentSets.data?.changeSets'
          position = text.find(marker)
          if position < 0:
              raise SystemExit("Stable proposal selector marker not found")
          prefix = text[:position + len(marker)]
          encoded = Path(".github/master-ai-tail-repair/tail.b64.gz").read_text(encoding="ascii")
          tail = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")
          path.write_text(prefix + tail, encoding="utf-8")

          Path(".github/master-ai-tail-repair/tail.b64.gz").unlink()
          Path(".github/master-ai-tail-repair").rmdir()
          Path(".github/workflows/repair-master-ai-tail.yml").unlink()
          PY
      - name: Commit repaired tail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Master AI proposal selector tail"
          git push origin HEAD:agent/master-ai-shell-workspace
