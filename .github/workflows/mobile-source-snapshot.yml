name: Mobile source snapshot

on:
  push:
    branches:
      - mobile-optimized
    paths:
      - ".github/workflows/mobile-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-optimized
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
