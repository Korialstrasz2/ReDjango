name: Apply Combat confirmation modals

on:
  push:
    branches:
      - mobile-optimized
    paths:
      - ".github/workflows/apply-combat-confirmation-modals.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-optimized
          fetch-depth: 0
      - name: Apply asserted source patch
        run: python scripts/apply_combat_confirmation_modals.py
      - name: Remove one-time patch machinery
        run: git rm scripts/apply_combat_confirmation_modals.py .github/workflows/apply-combat-confirmation-modals.yml
      - name: Commit exact source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ConfirmationModal.tsx frontend/src/components/ConfirmationModal.css frontend/src/features/combat/CombatPage.tsx frontend/tests/mobile-combat-roles.spec.ts
          git commit -m "Replace Combat native confirmations with shared modals"
          git push origin HEAD:mobile-optimized
