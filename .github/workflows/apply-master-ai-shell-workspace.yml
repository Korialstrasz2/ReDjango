name: Apply Master AI shell workspace refactor

on:
  push:
    branches:
      - agent/master-ai-shell-workspace
    paths:
      - ".github/workflows/apply-master-ai-shell-workspace.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-shell-workspace
      - name: Apply interface refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          root = Path(".github/master-ai-refactor")

          def decode(pattern: str, target: str) -> None:
              encoded = "".join(path.read_text(encoding="ascii") for path in sorted(root.glob(pattern)))
              if not encoded:
                  raise SystemExit(f"No payload files matched {pattern}")
              Path(target).write_bytes(base64.b64decode(encoded))

          app_path = Path("frontend/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          import_anchor = 'import { MediaCachePanel } from "./features/MediaCachePanel";'
          import_line = 'import { MasterAIPage } from "./features/master-ai/MasterAIPage";'
          if import_line not in app:
              if import_anchor not in app:
                  raise SystemExit("App import anchor not found")
              app = app.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          route_anchor = '<Route path="/tools/ai" element={<GameManagerOnly><AIManagementPage /></GameManagerOnly>} />'
          route_line = '<Route path="/tools/master-ai" element={<GameManagerOnly><MasterAIPage notify={notify} /></GameManagerOnly>} />'
          if route_line not in app:
              if route_anchor not in app:
                  raise SystemExit("App route anchor not found")
              app = app.replace(route_anchor, route_anchor + route_line, 1)
          app_path.write_text(app, encoding="utf-8")

          decode("MasterAIPage.*.b64", "frontend/src/features/master-ai/MasterAIPage.tsx")
          decode("master-ai-css.*.b64", "frontend/src/styles/master-ai.css")
          decode("main.*.b64", "frontend/src/main.tsx")
          decode("master-ai-spec.*.b64", "frontend/tests/master-ai.spec.ts")
          Path("frontend/src/features/master-ai/MasterAIRoot.tsx").unlink(missing_ok=True)

          for path in root.iterdir():
              path.unlink()
          root.rmdir()
          Path(".github/workflows/apply-master-ai-shell-workspace.yml").unlink()
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Master AI into the app workspace"
          git push origin HEAD:agent/master-ai-shell-workspace
