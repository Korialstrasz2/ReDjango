name: Mobile baseline desktop audit

on:
  push:
    branches:
      - mobile-optimized
    paths:
      - ".github/workflows/mobile-baseline-desktop-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned desktop baseline
        uses: actions/checkout@v4
        with:
          ref: da846aca31d31b15e4128f70b0cf0e6cb3b32283
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build baseline frontend
        working-directory: frontend
        run: npm run build
      - name: Run untouched baseline desktop suite
        working-directory: frontend
        run: npx playwright test --project=authenticated
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-desktop-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
