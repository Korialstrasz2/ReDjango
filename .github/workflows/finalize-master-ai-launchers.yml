name: Finalize Master AI launchers

on:
  push:
    branches:
      - agent/master-ai-proposal-system
    paths:
      - ".github/workflows/finalize-master-ai-launchers.yml"

permissions:
  contents: write

jobs:
  patch-launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-ai-proposal-system
      - name: Patch supported management components exactly
        run: |
          cat > /tmp/patch_launchers.py <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              if new in content:
                  return
              if old not in content:
                  raise SystemExit(f"Anchor not found in {path}: {old[:120]}")
              file.write_text(content.replace(old, new, 1), encoding="utf-8")

          item = "frontend/src/features/management/ItemManagementPage.tsx"
          replace_once(item, 'import { ItemEditorModal } from "../character/ItemEditorModal";\n', 'import { ItemEditorModal } from "../character/ItemEditorModal";\nimport { MasterAIAssistButton } from "../master-ai/launchers";\n')
          replace_once(
              item,
              '<header className="page-header"><div><p className="eyebrow">Gestione del gioco</p><h1>Catalogo oggetti</h1></div><div className="button-row"><Link className="button secondary" to="/tools">Tutti gli strumenti</Link><button className="button secondary" disabled={!selected} onClick={() => { if (selected) { setCloning(true); setEditorItem(selected); } }}>Clona selezionato</button><button className="button primary" onClick={() => { setCloning(false); setEditorItem(null); }}>Crea oggetto</button></div></header>',
              '<header className="page-header"><div><p className="eyebrow">Gestione del gioco</p><h1>Catalogo oggetti</h1></div><div className="button-row"><Link className="button secondary" to="/tools">Tutti gli strumenti</Link><MasterAIAssistButton entityType="item" sourceSurface="item-management" defaultPrompt="Aiutami a creare o aggiornare un oggetto del catalogo. Prepara soltanto una proposta da revisionare.">AI Assist</MasterAIAssistButton><button className="button secondary" disabled={!selected} onClick={() => { if (selected) { setCloning(true); setEditorItem(selected); } }}>Clona selezionato</button><button className="button primary" onClick={() => { setCloning(false); setEditorItem(null); }}>Crea oggetto</button></div></header>',
          )
          replace_once(
              item,
              '<header><div><p className="eyebrow">Oggetto #{selected.id}{selected.archived ? " · archiviato" : ""}{selected.special ? " · speciale" : ""}</p><h2>{selected.name}</h2></div><button className="button primary" onClick={() => setEditorItem(selected)}>Modifica</button></header>{selected.imageUrl',
              '<header><div><p className="eyebrow">Oggetto #{selected.id}{selected.archived ? " · archiviato" : ""}{selected.special ? " · speciale" : ""}</p><h2>{selected.name}</h2></div><button className="button primary" onClick={() => setEditorItem(selected)}>Modifica</button></header><div className="button-row master-ai-record-actions"><MasterAIAssistButton entityType="item" targetId={selected.id} recordLabel={selected.name} sourceSurface="item-management" defaultPrompt={`Rivedi «${selected.name}» e proponi le modifiche necessarie senza applicarle.`}>Chiedi al Master AI</MasterAIAssistButton><MasterAIAssistButton entityType="item" sourceId={selected.id} recordLabel={selected.name} sourceSurface="item-management" defaultPrompt={`Crea un nuovo oggetto simile a «${selected.name}», ma attendi le mie indicazioni per le differenze.`}>Crea simile con AI</MasterAIAssistButton></div>{selected.imageUrl',
          )

          skill = "frontend/src/features/management/SkillManagementPage.tsx"
          replace_once(skill, 'import { SkillEditor } from "../skills/SkillEditor";\n', 'import { MasterAIAssistButton } from "../master-ai/launchers";\nimport { SkillEditor } from "../skills/SkillEditor";\n')
          replace_once(
              skill,
              '<header className="page-header"><div><p className="eyebrow">Gestione del gioco</p><h1>Gestione Skill</h1><p>Catalogo, struttura e migrazione Elder in un\'unica postazione.</p></div><div className="button-row"><Link className="button secondary" to="/tools">Tutti gli strumenti</Link><button className="button primary" onClick={() => setSkillEditor("create")}>Crea skill</button></div></header>',
              '<header className="page-header"><div><p className="eyebrow">Gestione del gioco</p><h1>Gestione Skill</h1><p>Catalogo, struttura e migrazione Elder in un\'unica postazione.</p></div><div className="button-row"><Link className="button secondary" to="/tools">Tutti gli strumenti</Link><MasterAIAssistButton entityType="skill" sourceSurface="skill-management" defaultPrompt="Aiutami a creare o aggiornare una Skill o un incantesimo. Prepara soltanto una proposta da revisionare.">AI Assist</MasterAIAssistButton><button className="button primary" onClick={() => setSkillEditor("create")}>Crea skill</button></div></header>',
          )
          old_skill_inspector = '<SkillInspector skill={selectedSkill} loading={skillDetailQuery.isFetching || managementMutation.isPending} onEdit={() => setSkillEditor("edit")} onState={() => selectedSkill && managementMutation.mutate({ action: "management.skills.skill.state", payload: { skillId: selectedSkill.id, archived: !selectedSkill.archived }, success: selectedSkill.archived ? "Skill ripristinata." : "Skill archiviata." })} /></div>'
          new_skill_inspector = '<div className="skill-management-inspector-stack"><SkillInspector skill={selectedSkill} loading={skillDetailQuery.isFetching || managementMutation.isPending} onEdit={() => setSkillEditor("edit")} onState={() => selectedSkill && managementMutation.mutate({ action: "management.skills.skill.state", payload: { skillId: selectedSkill.id, archived: !selectedSkill.archived }, success: selectedSkill.archived ? "Skill ripristinata." : "Skill archiviata." })} />{selectedSkill && <div className="panel button-row master-ai-record-actions"><MasterAIAssistButton entityType={selectedSkill.magic ? "spell" : "skill"} targetId={selectedSkill.id} recordLabel={selectedSkill.name} sourceSurface="skill-management" defaultPrompt={`Rivedi «${selectedSkill.name}» e proponi le modifiche necessarie senza applicarle.`}>Chiedi al Master AI</MasterAIAssistButton><MasterAIAssistButton entityType={selectedSkill.magic ? "spell" : "skill"} sourceId={selectedSkill.id} recordLabel={selectedSkill.name} sourceSurface="skill-management" defaultPrompt={`Crea ${selectedSkill.magic ? "un incantesimo" : "una Skill"} simile a «${selectedSkill.name}», ma attendi le mie indicazioni per le differenze.`}>Crea simile con AI</MasterAIAssistButton></div>}</div></div>'
          replace_once(skill, old_skill_inspector, new_skill_inspector)

          theme = "frontend/src/features/management/ThemeManagementPage.tsx"
          replace_once(theme, 'import { resolveThemeColors, useApp } from "../../App";\n', 'import { resolveThemeColors, useApp } from "../../App";\nimport { MasterAIAssistButton } from "../master-ai/launchers";\n')
          replace_once(
              theme,
              '<Link className="button secondary" to="/tools">Tutti gli strumenti</Link>\n        <button type="button" className="button secondary" onClick={() => setCreating({ name: "", duplicateOfId: selected.id })}>Duplica</button>',
              '<Link className="button secondary" to="/tools">Tutti gli strumenti</Link>\n        <MasterAIAssistButton entityType="theme" sourceSurface="theme-management" defaultPrompt="Aiutami a creare o aggiornare un tema. Prepara soltanto una proposta da revisionare.">AI Assist</MasterAIAssistButton>\n        <button type="button" className="button secondary" onClick={() => setCreating({ name: "", duplicateOfId: selected.id })}>Duplica</button>',
          )
          replace_once(
              theme,
              '<span className="muted-copy">{selected.isDefault ? "Questo è il tema predefinito." : "Identificatore: " + selected.slug}</span>\n            {!selected.isDefault',
              '<span className="muted-copy">{selected.isDefault ? "Questo è il tema predefinito." : "Identificatore: " + selected.slug}</span>\n            <span className="master-ai-context-actions"><MasterAIAssistButton entityType="theme" targetId={selected.id} recordLabel={selected.name} sourceSurface="theme-management" defaultPrompt={`Rivedi il tema «${selected.name}» e proponi le modifiche necessarie senza applicarle.`}>Chiedi al Master AI</MasterAIAssistButton><MasterAIAssistButton entityType="theme" sourceId={selected.id} recordLabel={selected.name} sourceSurface="theme-management" defaultPrompt={`Crea un nuovo tema simile a «${selected.name}», ma attendi le mie indicazioni per le differenze.`}>Duplica con AI</MasterAIAssistButton></span>\n            {!selected.isDefault',
          )
          PY
          python /tmp/patch_launchers.py
          rm .github/workflows/finalize-master-ai-launchers.yml
      - name: Commit direct component integration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/management/ItemManagementPage.tsx frontend/src/features/management/SkillManagementPage.tsx frontend/src/features/management/ThemeManagementPage.tsx .github/workflows/finalize-master-ai-launchers.yml
          git commit -m "Integrate contextual Master AI launchers"
          git push origin HEAD:agent/master-ai-proposal-system
