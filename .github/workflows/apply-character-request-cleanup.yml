name: Apply character request cleanup

on:
  push:
    branches:
      - codex/remove-character-request-settings

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-character-request-settings
      - name: Apply cleanup
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/cleanup.py
          python3 /tmp/cleanup.py
          git diff --check
          python3 -m compileall -q backend
      - name: Validate backend
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run
          python manage.py test backend.core.tests.HierarchicalSettingsTests backend.core.tests_player_management.PlayerManagementServiceTests
      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Alep"
          git config user.email "65488656+Korialstrasz2@users.noreply.github.com"
          git add -A
          git commit -m "refactor(settings): remove character request flow"
          git push origin HEAD:codex/remove-character-request-settings
