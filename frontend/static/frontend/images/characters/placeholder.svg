<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" role="img" aria-labelledby="title description">
  <title id="title">Sagoma del personaggio</title>
  <desc id="description">Segnaposto fantasy per un ritratto del personaggio non ancora disponibile.</desc>
